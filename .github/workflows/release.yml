name: Release eipgam

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Package macOS app and CLI
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(go env GOARCH)" = "$ARCH"
          make app VERSION="${TAG#v}"
          codesign --force --deep --sign - --identifier com.sichengchen.eipgam eipgam.app
          codesign --verify --deep --strict eipgam.app
          mkdir -p dist
          ditto -c -k --keepParent eipgam.app "dist/eipgam-darwin-$ARCH.zip"
          make cli VERSION="${TAG#v}"
          cp eipgam "dist/eipgam-cli-darwin-$ARCH"
      - uses: actions/attest@v4
        with:
          subject-path: dist/eipgam-*
      - uses: actions/upload-artifact@v4
        with:
          name: eipgam-darwin-${{ matrix.arch }}
          path: dist/eipgam-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eipgam-darwin-*
          merge-multiple: true
          path: dist
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/eipgam-* --verify-tag --generate-notes --latest
