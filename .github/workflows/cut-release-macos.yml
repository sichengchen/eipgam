name: Prepare macOS release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version to prepare (current uses the latest stable tag or the initial version)
        type: choice
        required: true
        default: patch
        options: [current, patch, minor, major]

permissions:
  contents: read

concurrency:
  group: cut-release-macos
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'sichengchen/eipgam' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(python3 build/darwin/release-version.py "$BUMP")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    uses: ./.github/workflows/test.yml

  build:
    needs: version
    strategy:
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and verify app
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = "$ARCH"
          make app VERSION="$VERSION"
          codesign --force --sign - --identifier com.sichengchen.eipgam eipgam.app
          codesign --verify --deep --strict eipgam.app
          ditto -c -k --norsrc --keepParent eipgam.app native-app.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}-${{ github.run_attempt }}
          path: native-app.zip
          if-no-files-found: error
          compression-level: 0

  handoff:
    needs: [version, test, build]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-arm64-${{ github.run_attempt }}
          path: arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-amd64-${{ github.run_attempt }}
          path: amd64
      - name: Assemble signing handoff
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ditto -x -k arm64/native-app.zip arm64
          ditto -x -k amd64/native-app.zip amd64
          bash build/darwin/release-artifact.sh arm64/eipgam.app amd64/eipgam.app "$VERSION" handoff
          printf 'Signing repo: https://github.com/sichengchen/macos-release/actions\n\nBuild run ID: %s\n' \
            "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release-app-${{ github.run_attempt }}
          path: handoff/
          if-no-files-found: error
          compression-level: 0
